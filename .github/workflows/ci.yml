name: data-and-schedule

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m scripts.prepare_data
      - run: python -m scripts.validate_data
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- data/processed data/split_manifest.json
